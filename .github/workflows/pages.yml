name: Pages

# The website is this repo, as it sits: one HTML page, its fonts, media and
# pictures. The one thing built is the phone app in app/: its engine is the
# Kosika engine from the kosika repo, built to WebAssembly here on every
# push, so the app always runs the engine on kosika's studio branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: blackhole8080-darkmatter/kosika
          ref: studio
          path: _build/kosika
      - uses: actions/checkout@v4
        with:
          repository: blackhole8080-darkmatter/kosika-designs
          path: _build/kosika-designs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the phone app
        run: KOSIKA=_build/kosika DESIGNS=_build/kosika-designs app/build.sh
      - run: rm -rf _build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
